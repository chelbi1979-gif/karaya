
    name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build WebApp Native Wrapper
        run: |
          echo "Préparation du wrapper WebView pour https://chelbi1979-gif.github.io/karaya/"
          # Téléchargement d'un template WebView natif minimaliste
          curl -L -o app.zip https://github.com/chelbi1979-gif/karaya/archive/refs/heads/main.zip || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaya-webview-apk
          path: |
            *.apk
