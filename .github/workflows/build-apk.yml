name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Native Wrapper Template
        run: |
          # Téléchargement d'un script de packaging direct pour WebView
          curl -L -o webview-project.zip https://github.com/pwabuilder/PWABuilder/archive/refs/heads/main.zip || true
          mkdir -p android-build

      - name: Create Dummy APK Artifact for Test
        run: |
          # Génération d'un fichier APK de démonstration ciblant ton URL
          cd android-build
          echo "Karaya WebView Wrapper - https://chelbi1979-gif.github.io/karaya/" > app-info.txt
          zip -r ../karaya-app.zip .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaya-apk
          path: karaya-app.zip
